name: בניית הדף

# מריץ מחדש את בניית index.html ו-editor.html בכל פעם שהנתונים או התבניות
# משתנים, ודוחף את התוצאה חזרה לענף. כך אפשר לערוך בעורך, להעלות את
# organizations.json למאגר, והדף מתעדכן מעצמו.
on:
  push:
    paths:
      - "data/organizations.json"
      - "tools/template.html"
      - "tools/editor_template.html"
      - "tools/build_site.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: בניית הדפים
        run: python3 tools/build_site.py

      - name: דחיפת התוצאה
        run: |
          if git diff --quiet -- index.html editor.html; then
            echo "אין שינוי בקבצים הבנויים."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html editor.html
          git commit -m "בנייה מחדש של הדף מתוך הנתונים"
          git push
