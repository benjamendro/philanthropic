<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>עריכת מיפוי הארגונים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap">
<style>
:root {
  --ink:#1B2A4E; --body:#3A465F; --muted:#6B7690;
  --ground:#EEF1F6; --surface:#FFFFFF; --surface-2:#F7F9FC;
  --line:#D3DBE7; --line-soft:#E8EDF4;
  --core:#0F7DA8; --core-soft:#E6F2F8;
  --edit:#8A5A00; --edit-soft:#FDF3E0;
  --danger:#A03030;
  --sans:"Assistant","Segoe UI","Arial Hebrew",Arial,sans-serif;
}
*,*::before,*::after { box-sizing:border-box; }
body {
  margin:0; background:var(--ground); color:var(--body);
  font-family:var(--sans); font-size:15px; line-height:1.6;
}
h1,h2,h3 { margin:0; color:var(--ink); }
button, input, select, textarea { font-family:inherit; font-size:inherit; }
:focus-visible { outline:2px solid var(--core); outline-offset:2px; border-radius:4px; }

/* ---------------------------------------------------------------- topbar */
.topbar {
  position:sticky; top:0; z-index:30;
  background:var(--ink); color:#fff;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:11px 18px;
}
.topbar h1 { color:#fff; font-size:1rem; font-weight:700; }
.mode {
  font-size:.72rem; font-weight:700; letter-spacing:.04em;
  background:#F5C45E; color:#3A2A00; border-radius:100px; padding:2px 10px;
}
.topbar .spacer { flex:1; }
.dirty { font-size:.83rem; color:#C9D6E8; font-variant-numeric:tabular-nums; }
.dirty b { color:#F5C45E; }

.btn {
  border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.09);
  color:#fff; border-radius:7px; padding:6px 13px;
  font-size:.85rem; font-weight:600; cursor:pointer;
}
.btn:hover { background:rgba(255,255,255,.18); }
.btn-primary { background:#F5C45E; border-color:#F5C45E; color:#3A2A00; }
.btn-primary:hover { background:#FFD277; }

/* ------------------------------------------------------------------ hint */
.hint-bar {
  background:var(--edit-soft); border-bottom:1px solid #EBDCBE;
  color:var(--edit); font-size:.84rem; padding:9px 18px;
}
.hint-bar code { background:#fff; border:1px solid #EBDCBE; border-radius:4px; padding:1px 5px; }

/* ---------------------------------------------------------------- layout */
.wrap {
  display:grid; grid-template-columns:300px 1fr; gap:16px;
  padding:16px; align-items:start; max-width:1400px; margin:0 auto;
}
@media (max-width:900px) { .wrap { grid-template-columns:1fr; } }

.panel {
  background:var(--surface); border:1px solid var(--line);
  border-radius:11px; overflow:hidden;
}

/* -------------------------------------------------------------- org list */
.list-head { padding:11px 13px; border-bottom:1px solid var(--line-soft); }
.list-head input {
  width:100%; padding:7px 10px; border:1px solid var(--line);
  border-radius:7px; background:var(--surface-2); color:var(--ink);
}
.list { max-height:calc(100vh - 220px); overflow-y:auto; }
.list-item {
  display:flex; align-items:center; gap:8px; width:100%;
  padding:8px 13px; border:0; border-bottom:1px solid var(--line-soft);
  background:none; text-align:start; cursor:pointer; color:var(--body);
  font-size:.87rem; line-height:1.35;
}
.list-item:hover { background:var(--surface-2); }
.list-item[aria-current="true"] { background:var(--core-soft); color:var(--ink); font-weight:700; }
.list-item .flag { flex:0 0 6px; height:6px; border-radius:50%; background:transparent; }
.list-item.changed .flag { background:#D9A227; }
.list-item.added   .flag { background:#2E8B57; }
.list-item .nm { flex:1; min-width:0; }

/* ------------------------------------------------------------------ form */
.form { padding:18px 20px 26px; }
.form-head {
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding-bottom:13px; margin-bottom:16px; border-bottom:1px solid var(--line-soft);
}
.form-head h2 { font-size:1.05rem; flex:1; min-width:0; }

.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:640px) { .grid2 { grid-template-columns:1fr; } }

.f { display:flex; flex-direction:column; gap:5px; margin-bottom:15px; }
.f > label { font-size:.78rem; font-weight:700; color:var(--muted); }
.f > label .mark { color:#D9A227; margin-inline-start:5px; }
.f input[type=text], .f input[type=url], .f select, .f textarea {
  width:100%; padding:8px 11px; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
}
.f textarea { resize:vertical; min-height:74px; line-height:1.65; }
.f .help { font-size:.75rem; color:var(--muted); }

.opts { display:flex; flex-wrap:wrap; gap:6px; }
.opt {
  border:1px solid var(--line); background:var(--surface-2); color:var(--body);
  border-radius:100px; padding:3px 11px; font-size:.8rem; cursor:pointer;
}
.opt:hover { border-color:var(--core); color:var(--core); }
.opt[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:#fff; }

/* --------------------------------------------------------------- actions */
.acts { display:flex; flex-direction:column; gap:12px; }
.act {
  border:1px solid var(--line); border-radius:9px;
  padding:12px 14px; background:var(--surface-2);
}
.act-top { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
.act-top .n { font-size:.75rem; font-weight:700; color:var(--muted); flex:1; }
.icon-btn {
  border:1px solid var(--line); background:#fff; color:var(--muted);
  border-radius:6px; width:26px; height:26px; cursor:pointer; line-height:1;
}
.icon-btn:hover { border-color:var(--core); color:var(--core); }
.icon-btn.danger:hover { border-color:var(--danger); color:var(--danger); }

.row-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
.btn-ghost {
  border:1px solid var(--line); background:#fff; color:var(--core);
  border-radius:7px; padding:6px 13px; font-size:.83rem; font-weight:600; cursor:pointer;
}
.btn-ghost:hover { border-color:var(--core); background:var(--core-soft); }
.btn-ghost.danger { color:var(--danger); }
.btn-ghost.danger:hover { border-color:var(--danger); background:#FBEDED; }

.empty { padding:60px 20px; text-align:center; color:var(--muted); }
dialog {
  border:1px solid var(--line); border-radius:12px; padding:0;
  max-width:min(760px,92vw); box-shadow:0 12px 40px rgba(27,42,78,.22);
}
dialog::backdrop { background:rgba(27,42,78,.45); }
.dlg-head {
  padding:14px 18px; border-bottom:1px solid var(--line-soft);
  display:flex; align-items:center; gap:12px;
}
.dlg-head h3 { flex:1; font-size:1rem; }
.dlg-body { padding:16px 18px; max-height:60vh; overflow:auto; }
.dlg-body textarea {
  width:100%; min-height:320px; font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.8rem; direction:ltr; text-align:left;
  border:1px solid var(--line); border-radius:8px; padding:11px;
}
.dlg-foot { padding:12px 18px; border-top:1px solid var(--line-soft); display:flex; gap:8px; }
.dlg-foot .btn { background:var(--ink); border-color:var(--ink); }
.toast {
  position:fixed; inset-block-end:18px; inset-inline-start:18px; z-index:60;
  background:var(--ink); color:#fff; border-radius:8px; padding:9px 16px;
  font-size:.85rem; opacity:0; transform:translateY(8px);
  transition:opacity .2s, transform .2s; pointer-events:none;
}
.toast.on { opacity:1; transform:none; }
</style>
</head>
<body>

<header class="topbar">
  <h1>מיפוי הארגונים</h1>
  <span class="mode">מצב עריכה</span>
  <span class="spacer"></span>
  <span class="dirty" id="dirty"></span>
  <button class="btn" id="btnLoad">טעינת קובץ</button>
  <button class="btn" id="btnSummary">סיכום שינויים</button>
  <button class="btn" id="btnReset">איפוס</button>
  <button class="btn btn-primary" id="btnExport">ייצוא</button>
  <input type="file" id="fileInput" accept="application/json" hidden>
</header>

<div class="hint-bar">
  העריכה נשמרת בדפדפן הזה בלבד ואינה משנה את הדף המפורסם. בסיום לוחצים
  <b>ייצוא</b>, מקבלים <code>organizations.json</code>, ומחליפים בו את הקובץ
  שבתיקיית <code>data/</code> במאגר — הדף נבנה מחדש מעצמו.
</div>

<div class="wrap">
  <aside class="panel">
    <div class="list-head">
      <input type="search" id="q" placeholder="חיפוש ארגון">
    </div>
    <div class="list" id="list"></div>
    <div style="padding:11px 13px; border-top:1px solid var(--line-soft)">
      <button class="btn-ghost" id="btnAdd" style="width:100%">הוספת ארגון</button>
    </div>
  </aside>

  <main class="panel">
    <div id="form"></div>
  </main>
</div>

<dialog id="dlg">
  <div class="dlg-head">
    <h3 id="dlgTitle"></h3>
    <button class="icon-btn" id="dlgClose" aria-label="סגירה">✕</button>
  </div>
  <div class="dlg-body"><textarea id="dlgText" readonly></textarea></div>
  <div class="dlg-foot">
    <button class="btn" id="dlgCopy">העתקה</button>
    <button class="btn" id="dlgDownload">הורדה</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>

ליל עליון ומבואות החרמון. מציע לוח משרות אזורי, פורום מנכ\"לים אזורי, פורום משאבי אנוש אזורי (תיירות, תעשייה, קיבוצים), וחיבור לעסקים במרחב – ב-42 יישובים. משרדים בקריית שמונה ובצומת כ\"ח.\nמרכז אזורי לעסקים ולפיתוח קריירה המשותף למשרד הרווחה ולמועצות האזוריות הגליל העליון ומבואות חרמון. תחומי פעילות: ליווי עסקים ויזמים, תחום פרט, קשרי מעסיקים, ליווי קהילתי.","actions":[],"partners":[],"note":"","website":"https://taasuka.galil-elion.org.il/"},{"id":"מצפינים","name":"מצפינים","aliases":[],"type":"ארגון מפעיל אזורי","typeGroup":"ארגונים מפעילים","relevance":"ליבה","areaText":"צפון / גליל (מטולה)","scope":"צפון והגליל","places":["מטולה"],"tags":["הון אנושי","חדשנות ומו\"פ","מדיניות ורגולציה","פיתוח אזורי","אוכלוסיות ייחודיות","בעלי תפקידים ברשויות","הכשרות","חברה משותפת","חוסן אישי ותעסוקתי","חינוך","מנגנונים רשותיים","מנהיגות","מעסיקים ומפעלים","פיתוח יכולות","צעירים וסטודנטים","שיתופי פעולה","תעסוקה והשמות"],"intro":"קידום הצפון כאזור אטרקטיבי למחיה, פיתוח אסטרטגיות לניהול משותף של אתגרים אזוריים, עיצוב נרטיב צפוני, קידום חינוך אזורי, ותמיכה ביוזמות אזוריות – לרבות יצירת תנאים, תמריצים ומסלולים שימשכו צעירים להישאר/לחזור לצפון ולתרום להתחדשות הקהילתית והכלכלית.\nמצפינים היא תנועה אזרחית אזורית של אנשים שבחרו לקחת אחריות על עתיד הגליל.","actions":[{"title":"מנגנון מנהיגות והשמה לצעירים וסטודנטים-\"נבחרת המובילים\"","body":"תשתית קבועה המגייסת ומכשירה סטודנטים וצעירים (בני 20–37) כסוכני שינוי ומנהיגות מקומית לעידוד צמיחה דמוגרפית. התוכנית כוללת סמינרי עומק, מנטורינג אישי על ידי מנהלים בכירים מהמשק, והתמחות חברתית מעשית בשטח. הפעולה ממוקדת בחיבור ישיר של המשתתפים להזדמנויות תעסוקה איכותיות והשפעה במגזר הציבורי, ברשויות המקומיות ובחברה האזרחית בצפון, במטרה לשמר הון אנושי איכותי במרחב","partners":["אוניברסיטת תל-חי","קרן רוטשילד","הסוכנות היהודית","אשכול רשויות גליל מזרחי","ומעסיקים מקומיים"]},{"title":"מרחבי שינוי – פלטפורמת מפגשי עומק חודשיים וירידי תעסוקה לצעירי הצפון","body":"סדרת מפגשי עומק אזוריים חודשיים הפתוחים לכלל הצעירים בגילאי 21–35 במרחב. כל מפגש ממוקד בנושא כלכלי-אזורי קונקרטי (כגון יזמות, ניהול תקציב, ומיצוי זכויות) ומארח מומחים מהשורה הראשונה. המפגשים כוללים יחידות עבודה מעשיות לבניית יכולות בשטח, קבוצות שיח (\"בר פתוח\") ליצירת שיתופי פעולה וחיבורים מקצועיים, וכן כנסי תעסוקה ממוקדים בשותפות עם האקדמיה להצגת משרות רלוונטיות בצפון","partners":["אוניברסיטת תל-חי","אנשי תוכן"]},{"title":"נשים בגבולות – רשת אזורית ומנהיגות נרטיבית לחוסן משפחתי וקהילתי","body":"תוכנית אזרחית-חינוכית המפעילה קהילות למידה אזוריות מגוונות ורב-תרבותיות עבור אמהות בגבול הצפון. התוכנית מעניקה כלים מעשיים ומנהיגות נרטיבית לעיבוד המציאות המורכבת בקו העימות, במטרה לשנות את השפה הביתית ולמנוע העברת חרדה בין-דורית. הפעילות מייצרת רשת נשים מחברת ומניעה לפעולה, המגדילה את סיכויי הדור הצעיר לבחור בגליל כמרכז חיים יציב וארוך טווח.","partners":[]},{"title":"גיבוש וקידום ניירות עמדה ומדיניות מותאמת","body":"בנייה והובלה של תשתית מקצועית המתרגמת את צרכי השטח של צעירי המרחב לכדי מסמכי מדיניות ישומיים (כדוגמת תוכנית \"הון לצפון\"). הפעולה מתמקדת במיפוי וניתוח חסמים סטטוטוריים בתחומי הדיור, התעסוקה והטבות המס, וייצוגם הלאה באופן קבוע בוועדות הכנסת ובשולחנות עגולים ממשלתיים. מטרת המנגנון היא להבטיח כי תקציבי השיקום ותוכניות החומש הלאומיות יכללו תתי-פרקים ייעודיים המעוגנים בחקיקה ובהחלטות ממשלה עבור שימור וקליטת הון אנושי צעיר במרחב הגליל המזרחי","partners":[]},{"title":"ביסוס רשת שותפויות אסטרטגית רב-מגזרית (\"אקו-סיסטם אזורי\")","body":"בנייה והובלה של רשת שותפויות רב-מגזרית (Eco-system) המחברת בין האקדמיה, המגזר הציבורי והעסקי לטובת יציבות דמוגרפית. הפעולה מתמקדת ביצירת ממשקי עבודה ישירים מול מנהלי צמיחה דמוגרפית ורווחה ברשויות, לצד פיתוח קשרים מול מעסיקים וחברות ענק (כגון שברון ודפוס בארי). המנגנון משמש כעוגן פיננסי ואסטרטגי המאפשר לעמותה לבסס תשתית ארגונית עצמאית, לנהל תקציבים משותפים, ולהבטיח שמעני החוסן והתעסוקה לצעירים יוטמעו בתוכניות החומש המוסדיות של אשכולות הרשויות בצפון.","partners":[]}],"partners":["אוניברסיטת תל-חי","אנשי תוכן","אשכול רשויות גליל מזרחי","הסוכנות היהודית","ומעסיקים מקומיים","קרן רוטשילד"],"note":"","website":""},{"id":"מרכז-הידע-ה עסוקתי","מחפשי ומשדרגי עבודה","מעסיקים ומפעלים","עסקים ויעוץ","צעירים וסטודנטים","שיתופי פעולה","תעסוקה והשמות"],"intro":"קידום והקמת תשתיות לפיתוח מקורות תעסוקה לבוגרי מוסדות ההשכלה הגבוהה בנגב ובגליל, מניעת \"בריחת מוחות\" מהפריפריה ויצירת סביבות תעסוקה לשילוב אקדמאים ואנשי מקצוע; ייזום מפעלים חדשים ממקורות בארץ ובעולם ליצירת מקומות תעסוקה.\nקידום והקמת תשתיות לפיתוח מקורות תעסוקה לטובת כל הסטודנטים והסטודנטיות המסיימים לימודיהם במוסדות לימוד גבוהים בנגב, בגליל ובמגזר החרדי (בירושלים).\nקידום תעסוקה איכותית אזורית בגליל.\nמרכז לאודר לתעסוקה גליל מהווה מנוע צמיחה אזורי הפועל לחיזוק הגליל באמצעות חיבור בין תעסוקה, חדשנות, יזמות ופיתוח קהילתי. העשייה הרחבה של המרכז מייצרת אימפקט משמעותי עבור מעסיקים, מחפשי עבודה, יזמים ועסקים קטנים, תוך בניית אקוסיסטם אזורי המחבר בין אנשים, הזדמנויות ושותפויות המקדמות צמיחה כלכלית וחברתית ארוכת טווח בגליל.","actions":[{"title":"מנגנון השמה למשרות איכות","body":"מרכז לאודר לתעסוקה גליל מעניק למעסיקים מעטפת מקצועית רחבה לגיוס, חיבור ופיתוח הון אנושי איכותי באזור הצפון. בזכות רשת קשרים ענפה עם מוסדות אקדמיים, חברות תעשייה, הייטק וארגונים מובילים בגליל, המרכז מסייע באיתור מועמדים מדויקים לצורכי הארגון ובחיזוק החיבור בין מעסיקים לבין טאלנטים איכותיים באזור. סל המוצרים כולל פרסום משרות ממוקד, גישה למאגר מועמדים איכותי, ימי ראיונות מרוכזים, ימי זרקור וחשיפה לארגונים, כנסים וירידי תעסוקה, סדנאות מקצועיות למנהלים ולצוותי HR, חיבורים עם סטודנטים ובוגרי אקדמיה, לצד ליווי וייעוץ בהתאמת פתרונות תעסוקה לצרכים המשתנים של השוק. המרכז פועל מתוך תפיסה אזורית המחברת בין צמיחה עסקית, פיתוח קהילתי וחיזוק הכלכלה בגליל.","partners":[]},{"title":"חיבור בין אנשים, הזדמנויות ומעסיקים ליצירת עתיד תעסוקתי איכותי בגליל","body":"מרכז לאודר לתעסוקה גליל מלווה מחפשי עבודה בדרך לקריירה איכותית ומשמעותית באזור הצפון, באמצעות מעטפת מקצועית המשלבת ליווי אישי, חיבורים למעסיקים מובילים והקניית כלים עדכניים לעולם העבודה המשתנה. המרכז מעניק ייעוץ והכוונה תעסוקתית, חשיפה למשרות בתחומי ההייטק, התעשייה, הבריאות והסטארטאפים, לצד סיוע בכתיבת קורות חיים, בניית פרופיל לינקדאין וה שבות באצבע הגליל.","actions":[],"partners":[],"note":"","website":""},{"id":"שירות-התעסוקה","name":"שירות התעסוקה","aliases":[],"type":"גוף ממשלתי","typeGroup":"שלטון וגופים ציבוריים","relevance":"ליבה","areaText":"גליל מזרחי","scope":"גליל מזרחי","places":[],"tags":["הון אנושי","סביבה עסקית","חדשנות ומו\"פ","אוכלוסיות ייחודיות","הכשרות","חוסן אישי ותעסוקתי","כלים דיגיטליים","מחפשי ומשדרגי עבודה","מילואימניקים ובני זוג","מעסיקים ומפעלים","סבסוד ומענקים","עסקים ויעוץ","תעסוקה והשמות"],"intro":"","actions":[{"title":"אבחון, ייעוץ והכוון מקצועי לקריירה","body":"תחום זה מהווה את שער הכניסה לפיתוח ההון האנושי במרחב הגליל המזרחי. באמצעות שילוב של פלטפורמות דיגיטליות מתקדמות וייעוץ אנושי פרטני, המערך מאפשר מיפוי מעמיק של כישורי התושבים, איתור החוזקות שלהם והכוונתם המדויקת למסלולי תעסוקה או לימודים רלוונטיים. פעילות זו מונעת \"בזבוז\" של הון אנושי, תורמת לבחירות קריירה נכונות, ומבטיחה כי התושבים יפנו למקצועות שיש להם ביקוש אמיתי בשוק העבודה המקומי. אבחון מקוון iAM Career (אדם מילוא); מערכת BOOL (אבחון תעסוקתי בשיתוף המגזר העסקי); מערכת Claro Career (\"קלייר\" – ייעוץ דיגיטלי חכם); ייעוץ קריירה פרטני על ידי יועצי תעסוקה מומחים-פרונטלי/וידיאו/טלפוני","partners":["אדם מילוא"]},{"title":"הכשרות מקצועיות, קורסים ופיתוח מיומנויות (Up-skilling & Re-skilling)","body":"מענה אסטרטגי שנועד לגשר על פערי המיומנויות (Skills Gap) בשוק העבודה המשתנה, ולשדרג את הפריון הכלכלי באזור. המערך מציע קורסי הכשרה מקצועית בתחומי תעשייה מתקדמת, לוגיסטיקה, הייטק וקולינריה, לצד סדנאות לרכישת מיומנויות רכות ודיגיטליות (כמו אנגלית עסקית, עברית תעסוקתית ושימוש ב-AI). באמצעות סבסוד של עד 90% (מנגנון השוברים), התחום מספק לתושבים כלי זינוק לתפקידים איכותיים ומאפשר לתעשייה המקומית ליהנות מכוח אדם מיומן ומעודכן. הכלים שנכללים בקטגוריה זו: מערך הכשרות מקצועיות מחוזיות וארציות-בסבסוד שירות התעסוקה עד 100% מימון; שוברים להכשרה מקצועית (מימון קורסים לתושבים); השתלמויות וסדנאות לפיתוח מיומנויות (מחשבים, שפות, AI)-ללא עלות; קורסים מקוונים בשיתוף פלטפורמת \"קמפוס IL\"","partners":["משרד העבודה","רשות לחדשנות","עמותת צורים","ג'וינט","מכללות ועוד"]},{"title":"תוכניות ליווי ממוקדות, מעטפת חוסן וגיוון תעסוקתי","body":"מנוע מרכזי לשילוב אוכלוסיות ייחודיות וצמצום פערים חברתיים-כלכליים במרחב. מדובר בתוכניות עומק אינטנסיביות המעניקות ליווי ארוך טווח, אימון אישי ומעטפת רב-מקצועית (כולל פסיכולוגים ועו\"ס) עבור אוכלוסיות מורכבות, תובעי הבטחת הכנסה, מילואימניקים ובני זוגם, וכן שילוב מגזרי מגוון בחברות. תחום זה מחזק את החוסן התעסוקתי של התושבים בתקופות משבר ומבטיח כי אף אוכלוסייה לא תישאר מאחור, דבר המגדיל את שיעור התעסוקה הכללי באזור. תוכנית \"מעגלי תעסוקה\" (לתובעי הבטחת הכנסה ודורשי עבודה מורכבים); תוכנית \"איתן\" (אימון וכוון תעסוקתי אינטנסיבי לפיתוח קריירה תובעי אבטלה ); תוכנית \"ממדים לתעסוקה\" (מענה ייעודי למילואימניקים ובני/בנות זוגם); ליווי, גיוס והכשרת אוכלוסיות מגוונות (גיוון תעסוקתי בארגונים); אפליקציית \"הקפסולה לחוסן\" (לחיזוק החוסן הרגשי והתעסוקתי)","partners":["רש\"י","ג'וינט"]},{"title":"פתרונות גיוס, השמה וליווי אסטרטגי למעסיקים ולתעשייה","body":"מתן מענה ישיר וממוקד למגזר העסקי, למפעלים ולמעסיקים בגליל המזרחי במטרה להניע צמיחה עסקית. השירות כולל ניהול פרויקטי גיוס מקצה לקצה בהתאם לצרכי המעסיק, ארגון ימי ראיונות מרוכזים בלשכות, ומתן תמריצים כלכליים (שוברים למעסיקים) להכשרת עובדים חדשים תוך כדי תנועה בעסק (On the Job Training). תחום זה חוסך לעסקים מקומיים אלפי שקלים בעלויות גיוס והכשרה ומייצר חיבור ישיר ומהיר בין היצע המשרות לביקוש. תכנון וניהול פרויקטי גיוס אסטרטגיים מקצה לקצה; ימי ראיונות מרוכזים ומרכזי הערכה במבני הלשכה; שוברים למעסיקים (מימון הכשרת עובדים בתוך העסק); פלטפורמת פרסום וחשיפת משרות במאגר הארצי; שירותי איתור מתקדמים: \"מועמד הזהב\" ו\"צייד המועמדים\"","partners":["משרד הכלכלה","העבודה","עמותות"]},{"title":"חדשנות טכנולוגית ומענים היברידיים בשירות התעסוקה","body":"הנגשת השירותים והאצת תהליכי ההשמה באמצעות פיתוחים טכנולוגיים מבוססי בינה מלאכותית (AI) ומודלים היברידיים. תחום זה מאפשר לתושבים לנהל את חיפוש העבודה והשדרוג המקצועי מרחוק ובאופן גמיש, תוך שימוש בסימולטורים חכמים להכנה לראיונות, סוכני משרות אוטומטיים שסורקים את השוק 24/7 ובוטים לפניות הציבור. טכנולוגיות אלו מייעלות דרמטית את תהליכי התיווך וההשמה בשוק העבודה האזורי. מנוע חיפוש משרות חכם וסוכן משרות AI; מערכת Co-Job (סימולטור ראיונות עבודה מבוסס בינה מלאכותית); מסלול השירות הדיגיטלי/היברידי (ניהול תהליך מרחוק); הבוטית החכמה איה AI (מענה ומידע 24/7).","partners":[]}],"partners":["אדם מילוא","ג'וינט","העבודה","מכללות ועוד","משרד הכלכלה","משרד העבודה","עמותות","עמותת צורים","רש\"י","רשות לחדשנות"],"note":"גוף ממשלתי – אינו מהמגזר השלישי, נכלל כשחקן מרכזי במפת הפיתוח הכלכלי.","website":""},{"id":"תנועת-אור","name":"תנועת אור","aliases":[],"type":"ארגון מפעיל / תנועת התיישבות","typeGroup":"ארגונים מפעילים","relevance":"ליבה","areaText":"ארצי, בדגש הגליל","scope":"צפון והגליל","places":[],"tags":["השכלה גבוהה","חינוך","רווחה וקהילה"],"intro":"תנועת אור לפיתוח ויישוב הנגב והגליל: תנועת התיישבות שהוקמה ב-2002, פועלת ללא כוונת רווח בשיתוף משרדי ממשלה, הסוכנות היהודית, רשויות מקומיות וקק\"ל. מטרתה ליצור את מכלול התנאים המאפשרים מעבר מהמרכז לנגב ולגליל – חינוך, דיור, תעסוקה ושירותים נלווים. יזמה הקמת שבעה יישובים חדשים בנגב ובגליל ויישבה 23 גרעיני התיישבות צעירים ביישובי פריפריה.","actions":[],"partners":[],"note":"","website":""},{"id":"121-מנוע-לשינוי-חברתי","name":"121 – מנוע לשינוי חברתי","aliases":[],"type":"ארגון מדיניות","typeGroup":"ארגונים מפעילים","relevance":"משיק","areaText":"ארצי","scope":"ארצי","places":[],"tags":["מדיניות ורגולציה","רווחה וקהילה","תעסוקה והשמות"],"intro":"עמותה לא-מפלגתית המתמחה בקידום מדיניות חברתית-כלכלית. פועלת לפיתוח הצעות חקיקה ומדיניות לשיפור רשת הביטחון החברתית-כלכלית בתחומי תעסוקה, רווחה, חינוך, דיור, גיל שלישי ובריאות, בשיתוף ארגונים חברתיים ועסקיים, אקדמיה ובעלי עניין.","actions":[],"partners":[],"note":"","website":""},{"id":"JFNA-הפדרציות-היהודיות-של-צפון-אמריקה","name":"JFNA הפדרציות היהודיות של צפון אמריקה","aliases":[],"type":"קרן/ארגון גג פילנתרופי זר","typeGroup":"קרנות ופילנתרופיה","relevance":"משיק","areaText":"ישראל – ארצי","scope":"ארצי","places":[],"tags":["הון אנושי","הכשרות","חינוך","רווחה וקהילה"],"intro":"קואליציה פיל const STORE_KEY = "galilee-mapping-editor";

const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");

let data = loadSaved() || clone(BASELINE);
let selected = 0;
let query = "";

/* --------------------------------------------------------- vocabularies */
const uniq = a => [...new Set(a.filter(Boolean))];
const VOCAB = {
  relevance: uniq(BASELINE.organizations.map(o => o.relevance)),
  typeGroup: uniq(BASELINE.organizations.map(o => o.typeGroup)).sort((a,b)=>a.localeCompare(b,"he")),
  scope: ["גליל מזרחי", "צפון והגליל", "ארצי"],
  places: uniq(BASELINE.organizations.flatMap(o => o.places)).sort((a,b)=>a.localeCompare(b,"he")),
  tags: uniq(BASELINE.organizations.flatMap(o => o.tags)).sort((a,b)=>a.localeCompare(b,"he")),
};

/* -------------------------------------------------------------- storage */
function loadSaved() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch {}
}

/* ------------------------------------------------------ change tracking */
const baseById = new Map(BASELINE.organizations.map(o => [o.id, o]));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

function orgState(org) {
  const base = baseById.get(org.id);
  if (!base) return "added";
  return same(base, org) ? "" : "changed";
}
function fieldChanged(org, field) {
  const base = baseById.get(org.id);
  return base ? !same(base[field], org[field]) : true;
}
function countChanges() {
  const changed = data.organizations.filter(o => orgState(o)).length;
  const removed = BASELINE.organizations.filter(
    b => !data.organizations.some(o => o.id === b.id)).length;
  return changed + removed;
}

/* ----------------------------------------------------------------- list */
function visible() {
  const q = query.trim();
  return data.organizations
    .map((o, i) => ({ o, i }))
    .filter(({ o }) => !q || o.name.includes(q));
}

function renderList() {
  $("list").innerHTML = visible().map(({ o, i }) => {
    const st = orgState(o);
    return `<button type="button" class="list-item ${st}" data-i="${i}"
              aria-current="${i === selected}">
      <span class="flag"></span><span class="nm">${esc(o.name)}</span>
    </button>`;
  }).join("") || `<div class="empty">אין תוצאות</div>`;

  const n = countChanges();
  $("dirty").innerHTML = n ? `<b>${n}</b> ארגונים שונו` : "אין שינויים";
}

/* ----------------------------------------------------------------- form */
function field(label, org, key, html) {
  const mark = fieldChanged(org, key) ? `<span class="mark" title="שונה">●</span>` : "";
  return `<div class="f"><label>${label}${mark}</label>${html}</div>`;
}

function renderForm() {
  const org = data.organizations[selected];
  if (!org) { $("form").innerHTML = `<div class="empty">בחרו ארגון מהרשימה</div>`; return; }

  const opts = (list, current) =>
    list.map(v => `<option value="${esc(v)}"${v === current ? " selected" : ""}>${esc(v)}</option>`).join("");
  const chips = (list, current, key) => `<div class="opts" data-multi="${key}">` + list.map(v =>
    `<button type="button" class="opt" data-val="${esc(v)}"
       aria-pressed="${current.includes(v)}">${esc(v)}</button>`).join("") + `</div>`;

  $("form").innerHTML = `
  <div class="form">
    <div class="form-head">
      <h2>${esc(org.name)}</h2>
      <button class="btn-ghost" data-cmd="revert">שחזור למקור</button>
      <button class="btn-ghost danger" data-cmd="delete">מחיקה</button>
    </div>

    ${field("שם הגוף", org, "name",
      `<input type="text" data-k="name" value="${esc(org.name)}">`)}

    <div class="grid2">
      ${field("רלוונטיות", org, "relevance",
        `<select data-k="relevance">${opts(VOCAB.relevance, org.relevance)}</select>`)}
      ${field("משפחת הגוף", org, "typeGroup",
        `<select data-k="typeGroup">${opts(VOCAB.typeGroup, org.typeGroup)}</select>`)}
      ${field("סוג הגוף (טקסט חופשי)", org, "type",
        `<input type="text" data-k="type" value="${esc(org.type)}">`)}
      ${field("היקף הפעילות", org, "scope",
        `<select data-k="scope">${opts(VOCAB.scope, org.scope)}</select>`)}
    </div>

    ${field("מרחב פעילות (הטקסט שמוצג בכרטיס)", org, "areaText",
      `<input type="text" data-k="areaText" value="${esc(org.areaText)}">`)}

    ${field("יישובים לסינון", org, "places",
      chips(VOCAB.places, org.places, "places") +
      `<span class="help">רק יישובים שבתוך הגליל המזרחי.</span>`)}

    ${field("תגיות", org, "tags",
      chips(VOCAB.tags, org.tags, "tags") +
      `<div class="row-btns"><button class="btn-ghost" data-cmd="add-tag">תגית חדשה</button></div>`)}

    ${field("פסקת פתיחה", org, "intro",
      `<textarea data-k="intro" rows="5">${esc(org.intro)}</textarea>`)}

    <div class="f">
      <label>פעולות ותוכניות${fieldChanged(org, "actions") ? `<span class="mark">●</span>` : ""}</label>
      <div class="acts">${org.actions.map((a, j) => `
        <div class="act">
          <div class="act-top">
            <span class="n">פעולה ${j + 1}</span>
            <button class="icon-btn" data-move="${j}" data-dir="-1" title="הזזה למעלה">↑</button>
            <button class="icon-btn" data-move="${j}" data-dir="1" title="הזזה למטה">↓</button>
            <button class="icon-btn danger" data-del-act="${j}" title="מחיקה">✕</button>
          </div>
          <div class="f"><label>כותרת</label>
            <input type="text" data-a="${j}" data-ak="title" value="${esc(a.title)}"></div>
          <div class="f"><label>תיאור</label>
            <textarea data-a="${j}" data-ak="body" rows="3">${esc(a.body)}</textarea></div>
          <div class="f"><label>שותפים</label>
            <input type="text" data-a="${j}" data-ak="partners" value="${esc(a.partners.join(", "))}">
            <span class="help">מופרדים בפסיק.</span></div>
        </div>`).join("")}
      </div>
      <div class="row-btns"><button class="btn-ghost" data-cmd="add-act">הוספת פעולה</button></div>
    </div>

    ${field("הערה", org, "note",
      `<textarea data-k="note" rows="2">${esc(org.note)}</textarea>`)}
    ${field("אתר הארגון", org, "website",
      `<input type="url" data-k="website" value="${esc(org.website)}" dir="ltr">`)}
  </div>`;
}

function render() { renderList(); renderForm(); }

/* -------------------------------------------------------------- editing */
function update(fn) {
  fn(data.organizations[selected]);
  save();
  render();
}

$("list").addEventListener("click", e => {
  const btn = e.target.closest(".list-item");
  if (btn) { selected = +btn.dataset.i; render(); }
});
$("q").addEventListener("input", e => { query = e.target.value; renderList(); });

/* מסמן שדה שהשתנה ומרענן את מונה השינויים בלי לבנות מחדש את הטופס,
   כדי שהמיקוד בשדה שנערך לא ילך לאיבוד באמצע ההקלדה. */
function refreshStatus(input, key) {
  renderList();
  const wrap = input.closest(".f");
  const label = wrap && wrap.querySelector(":scope > label");
  if (!label) return;
  const has = label.querySelector(".mark");
  const changed = fieldChanged(data.organizations[selected], key);
  if (changed && !has) label.insertAdjacentHTML("beforeend", '<span class="mark" title="שונה">●</span>');
  if (!changed && has) has.remove();
}

$("form").addEventListener("input", e => {
  const org = data.organizations[selected];
  const t = e.target;
  if (t.dataset.k) {
    org[t.dataset.k] = t.value;
    save();
    refreshStatus(t, t.dataset.k);
    return;
  }
  if (t.dataset.a !== undefined) {
    const act = org.actions[+t.dataset.a];
    act[t.dataset.ak] = t.dataset.ak === "partners"
      ? t.value.split(",").map(s => s.trim()).filter(Boolean)
      : t.value;
    save();
    renderList();
  }
});

$("form").addEventListener("click", e => {
  const org = data.organizations[selected];

  const opt = e.target.closest(".opt");
  if (opt) {
    const key = opt.closest("[data-multi]").dataset.multi;
    const v = opt.dataset.val;
    const set = new Set(org[key]);
    set.has(v) ? set.delete(v) : set.add(v);
    return update(o => { o[key] = [...set]; });
  }

  const mv = e.target.closest("[data-move]");
  if (mv) {
    const j = +mv.dataset.move, to = j + +mv.dataset.dir;
    if (to < 0 || to >= org.actions.length) return;
    return update(o => { const [a] = o.actions.splice(j, 1); o.actions.splice(to, 0, a); });
  }

  const da = e.target.closest("[data-del-act]");
  if (da) {
    if (!confirm("למחוק את הפעולה?")) return;
    return update(o => o.actions.splice(+da.dataset.delAct, 1));
  }

  const cmd = e.target.closest("[data-cmd]")?.dataset.cmd;
  if (cmd === "add-act")
    return update(o => o.actions.push({ title:"", body:"", partners:[] }));
  if (cmd === "add-tag") {
    const t = prompt("שם התגית החדשה:");
    if (!t || !t.trim()) return;
    const tag = t.trim();
    if (!VOCAB.tags.includes(tag)) VOCAB.tags.push(tag), VOCAB.tags.sort((a,b)=>a.localeCompare(b,"he"));
    return update(o => { if (!o.tags.includes(tag)) o.tags.push(tag); });
  }
  if (cmd === "revert") {
    const base = baseById.get(org.id);
    if (!base) return toast("ארגון חדש — אין גרסה מקורית לשחזר אליה");
    if (!confirm("לשחזר את הארגון לגרסה המקורית?")) return;
    data.organizations[selected] = clone(base);
    save(); render();
    return toast("שוחזר");
  }
  if (cmd === "delete") {
    if (!confirm(`למחוק את "${org.name}" מהמיפוי?`)) return;
    data.organizations.splice(selected, 1);
    selected = Math.max(0, selected - 1);
    save(); render();
    return toast("נמחק");
  }
});

$("btnAdd").addEventListener("click", () => {
  const name = prompt("שם הארגון החדש:");
  if (!name || !name.trim()) return;
  data.organizations.unshift({
    id: "new-" + Date.now(), name: name.trim(), aliases: [],
    type: "", typeGroup: VOCAB.typeGroup[0], relevance: VOCAB.relevance[0],
    areaText: "", scope: "גליל מזרחי", places: [], tags: [],
    intro: "", actions: [], partners: [], note: "", website: "",
  });
  selected = 0; query = ""; $("q").value = "";
  save(); render();
});

$("btnReset").addEventListener("click", () => {
  if (!confirm("לבטל את כל השינויים ולחזור לגרסה שהדף נבנה ממנה?")) return;
  data = clone(BASELINE); selected = 0;
  try { localStorage.removeItem(STORE_KEY); } catch {}
  render();
  toast("הכול אופס");
});

/* --------------------------------------------------------------- export */
function payloadForExport() {
  const out = clone(data);
  out.organizations.forEach(o => {
    o.partners = [...new Set(o.actions.flatMap(a => a.partners))].sort((a,b)=>a.localeCompare(b,"he"));
  });
  return out;
}

function summary() {
  const lines = [`שינויים במיפוי — ${new Date().toLocaleDateString("he-IL")}`, ""];
  const LABEL = {
    name:"שם", relevance:"רלוונטיות", typeGroup:"משפחת הגוף", type:"סוג הגוף",
    scope:"היקף הפעילות", areaText:"מרחב פעילות", places:"יישובים", tags:"תגיות",
    intro:"פסקת פתיחה", note:"הערה", website:"אתר", actions:"פעולות",
  };
  let n = 0;
  for (const org of data.organizations) {
    const base = baseById.get(org.id);
    if (!base) { lines.push(`+ ארגון חדש: ${org.name}`, ""); n++; continue; }
    const diffs = Object.keys(LABEL).filter(k => !same(base[k], org[k]));
    if (!diffs.length) continue;
    n++;
    lines.push(`■ ${org.name}`);
    for (const k of diffs) {
      if (k === "actions") { lines.push(`   פעולות: ${base.actions.length} ← ${org.actions.length}, תוכן עודכן`); continue; }
      const b = Array.isArray(base[k]) ? base[k].join(", ") : base[k];
      const a = Array.isArray(org[k]) ? org[k].join(", ") : org[k];
      lines.push(`   ${LABEL[k]}:`, `      לפני: ${b || "(ריק)"}`, `      אחרי: ${a || "(ריק)"}`);
    }
    lines.push("");
  }
  for (const b of BASELINE.organizations) {
    if (!data.organizations.some(o => o.id === b.id)) { lines.push(`− נמחק: ${b.name}`, ""); n++; }
  }
  if (!n) lines.push("לא נמצאו שינויים.");
  return lines.join("\n");
}

let dlgFile = "";
function openDialog(title, text, filename) {
  $("dlgTitle").textContent = title;
  $("dlgText").value = text;
  dlgFile = filename;
  $("dlg").showModal();
}
$("dlgClose").addEventListener("click", () => $("dlg").close());
$("dlgCopy").addEventListener("click", async () => {
  const el = $("dlgText");
  try { await navigator.clipboard.writeText(el.value); }
  catch { el.select(); document.execCommand("copy"); }
  toast("הועתק ללוח");
});
$("dlgDownload").addEventListener("click", () => {
  const blob = new Blob([$("dlgText").value], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = dlgFile;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

$("btnExport").addEventListener("click", () =>
  openDialog("organizations.json", JSON.stringify(payloadForExport(), null, 1), "organizations.json"));
$("btnSummary").addEventListener("click", () =>
  openDialog("סיכום השינויים", summary(), "changes.txt"));

/* ----------------------------------------------------------------- load */
$("btnLoad").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    if (!Array.isArray(parsed.organizations)) throw new Error("no organizations array");
    data = parsed; selected = 0;
    save(); render();
    toast(`נטענו ${parsed.organizations.length} ארגונים`);
  } catch {
    toast("הקובץ אינו קובץ מיפוי תקין");
  }
  e.target.value = "";
});

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2400);
}

addEventListener("beforeunload", e => {
  if (countChanges()) { e.preventDefault(); e.returnValue = ""; }
});

render();
</script>
</body>
</html>
